<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Prontuário Médico</title>
  <link rel="stylesheet" href="assets/styles/web.css" />
  <link rel="stylesheet" href="assets/styles/app-overrides.css" />
</head>
<body class="auth-page web-mode">
  <div class="card">
    <h1>Entrar</h1>
    <p>Use o e-mail e senha cadastrados para acessar seu prontuário pessoal.</p>

    <form>
      <label>
        E-mail
        <input type="email" name="email" placeholder="usuario@exemplo.com" required />
      </label>
      <label>
        Senha
        <input type="password" name="senha" placeholder="••••••••" required />
      </label>
      <div class="options">
        <label style="font-size: 0.8rem;">
          <input type="checkbox" name="lembrar" /> Lembrar-me
        </label>
        <a href="#">Esqueci minha senha</a>
      </div>
      <button type="button">Entrar</button>
    </form>
  </div>
</body>
</html>
