<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Prontuário Médico</title>
  <style>
    :root {
      font-family: "Inter", system-ui, sans-serif;
      color: #0f172a;
      background-color: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: linear-gradient(135deg, #eef2ff, #e0f2fe);
      padding: 1rem;
    }

    .card {
      width: min(420px, 100%);
      background: #ffffff;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 30px 50px rgba(15, 23, 42, 0.15);
    }

    h1 {
      margin: 0;
      font-size: 1.75rem;
      color: #111827;
    }

    p {
      margin-top: 0.35rem;
      color: #475569;
    }

    form {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      display: flex;
      flex-direction: column;
      font-size: 0.95rem;
      color: #0f172a;
    }

    input {
      margin-top: 0.3rem;
      padding: 0.75rem;
      border-radius: 0.65rem;
      border: 1px solid #cbd5f5;
      font-size: 1rem;
      background: #f8fafc;
    }

    button {
      padding: 0.9rem;
      border: none;
      border-radius: 0.75rem;
      font-weight: 600;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #475569;
    }

    .options a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Entrar</h1>
    <p>Use o e-mail e senha cadastrados para acessar seu prontuário pessoal.</p>

    <form>
      <label>
        E-mail
        <input type="email" name="email" placeholder="usuario@exemplo.com" required />
      </label>
      <label>
        Senha
        <input type="password" name="senha" placeholder="••••••••" required />
      </label>
      <div class="options">
        <label style="font-size: 0.8rem;">
          <input type="checkbox" name="lembrar" /> Lembrar-me
        </label>
        <a href="#">Esqueci minha senha</a>
      </div>
      <button type="button">Entrar</button>
    </form>
  </div>
</body>
</html>
