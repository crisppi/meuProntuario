<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editar exame cadastrado – Prontuário</title>
  <link rel="stylesheet" href="assets/styles/web.css" />
  <link rel="stylesheet" href="assets/styles/app-overrides.css" />
</head>
<body class="full-screen-center web-mode">
  <div class="card">
    <h1>Editar exame cadastrado</h1>
    <p>Atualize as referências, frequência ou laboratório antes do exame ser coletado. <a href="listagem-exames-cadastrados.html">Voltar para a lista</a>.</p>

    <form id="edit-exam-form" class="grid-form" hidden>
      <input type="hidden" name="exame_id" />

      <label>
        Nome do exame
        <input type="text" name="nome_exame" required />
      </label>

      <label>
        Tipo
        <select name="tipo_exame" required>
          <option value="">Selecione</option>
          <option value="laboratorial">Laboratorial</option>
          <option value="imagem">Imagem</option>
          <option value="clinico">Clínico</option>
        </select>
      </label>

      <label>
        Unidade
        <input type="text" name="unidade" />
      </label>

      <label>
        Referência mínima
        <input type="number" step="0.01" name="referencia_min" />
      </label>

      <label>
        Referência máxima
        <input type="number" step="0.01" name="referencia_max" />
      </label>

      <label>
        Frequência recomendada
        <input type="text" name="frequencia" />
      </label>

      <label>
        Laboratório
        <input type="text" name="laboratorio" />
      </label>

      <label class="full-width">
        Observações
        <textarea name="observacoes"></textarea>
      </label>

      <label>
        Data prevista
        <input type="date" name="data_realizacao" />
      </label>
    </form>

    <div id="edit-loading" class="loading">Carregando o exame...</div>
    <div id="exam-feedback" class="form-feedback" aria-live="polite" hidden></div>

    <div class="actions" id="form-actions" hidden>
      <button type="button" class="button secondary" onclick="window.location.href='listagem-exames-cadastrados.html'">Cancelar</button>
      <button type="button" class="button primary" id="edit-exam-submit">Salvar alterações</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('edit-exam-form');
    const submitBtn = document.getElementById('edit-exam-submit');
    const loading = document.getElementById('edit-loading');
    const feedback = document.getElementById('exam-feedback');
    const actions = document.getElementById('form-actions');

    const query = new URLSearchParams(window.location.search);
    const slug = query.get('exame')?.trim() ?? '';
    const exameIdParam = query.get('exame_id');
    const exameId = exameIdParam ? Number(exameIdParam) : null;
    const hasExamId = exameId !== null && !Number.isNaN(exameId);
    const definitionsUrl = new URL('../process/exam-definitions.php', window.location.href).href;
    const saveUrl = new URL('../process/exam.php', window.location.href).href;

    const showMessage = (text, type = 'success') => {
      feedback.textContent = text;
      feedback.classList.remove('success', 'error');
      feedback.classList.add(type);
      feedback.hidden = false;
    };

    const showError = (text) => {
      loading.hidden = true;
      showMessage(text, 'error');
    };

    const showForm = () => {
      form.hidden = false;
      actions.hidden = false;
      loading.hidden = true;
    };

    const setField = (name, value) => {
      const field = form.elements[name];
      if (field) {
        field.value = value ?? '';
      }
    };

    const loadDefinition = async () => {
      if (!slug && !hasExamId) {
        showError('Identificador de exame ausente.');
        return;
      }

      try {
        const response = await fetch(definitionsUrl, {
          headers: {
            Accept: 'application/json',
          },
        });
        const payload = await response.json();

        if (!response.ok || payload.success === false) {
          throw new Error(payload.message ?? 'Falha ao carregar o exame.');
        }

        const rows = Array.isArray(payload.data) ? payload.data : [];
        const examRow = rows.find((row) => {
          const rowId = row.exame_id ? Number(row.exame_id) : null;
          if (slug && row.slug === slug) {
            return true;
          }
          if (hasExamId && rowId === exameId) {
            return true;
          }
          return false;
        });
        if (!examRow) {
          throw new Error('Exame não encontrado.');
        }

        setField('exame_id', examRow.exame_id ?? '');
        setField('nome_exame', examRow.nome);
        setField('tipo_exame', examRow.tipo);
        setField('unidade', examRow.unidade);
        setField('referencia_min', examRow.referencia_min);
        setField('referencia_max', examRow.referencia_max);
        setField('frequencia', examRow.frequencia);
        setField('laboratorio', examRow.laboratorio);
        setField('observacoes', examRow.observacoes);
        if (examRow.data_realizacao) {
          setField('data_realizacao', examRow.data_realizacao.split(' ')[0]);
        }

        showForm();
      } catch (error) {
        showError(error instanceof Error ? error.message : 'Erro inesperado.');
      }
    };

    const saveExam = async () => {
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      submitBtn.disabled = true;
      feedback.hidden = true;

      try {
        const response = await fetch(saveUrl, {
          method: 'POST',
          body: new FormData(form),
          headers: {
            Accept: 'application/json',
          },
        });

        const contentType = response.headers.get('content-type') ?? '';
        const text = await response.text();

        if (!contentType.includes('application/json')) {
          throw new Error('Resposta inesperada do servidor.');
        }

        const payload = JSON.parse(text);
        if (!response.ok || payload.success === false) {
          throw new Error(payload.message ?? 'Erro ao salvar o exame.');
        }

        showMessage(payload.message ?? 'Alterações salvas.', 'success');
      } catch (error) {
        showMessage(error instanceof Error ? error.message : 'Erro inesperado.', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    };

    submitBtn.addEventListener('click', saveExam);
    window.addEventListener('DOMContentLoaded', loadDefinition);
  </script>
</body>
</html>
